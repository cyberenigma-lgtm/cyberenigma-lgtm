<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2D2A45" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1E1B2E" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0E0C17" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Neon Cyan Gradients (Top Neural Web) -->
    <linearGradient id="cyanNeon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#57D1E8"/>
      <stop offset="100%" stop-color="#A6F4FF"/>
    </linearGradient>

    <!-- Neon Amber Gradients (Bottom Silicon Roots) -->
    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="60%" stop-color="#E07A2B"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>

    <!-- Text Metallic Silver/Cyan Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E7F2F8"/>
      <stop offset="65%" stop-color="#57D1E8"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#57D1E8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Badge Frame -->
  <rect x="40" y="40" width="720" height="720" rx="48" ry="48" fill="url(#bgGlow)" stroke="#57D1E8" stroke-width="3" filter="url(#dropGlow)" />
  <rect x="52" y="52" width="696" height="696" rx="40" ry="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Subtle Circuit Grid Accents in Background -->
  <g opacity="0.12" stroke="#57D1E8" stroke-width="1.5">
    <path d="M 80 160 L 220 160 L 260 200" fill="none"/>
    <path d="M 720 160 L 580 160 L 540 200" fill="none"/>
    <path d="M 80 640 L 220 640 L 260 600" fill="none"/>
    <path d="M 720 640 L 580 640 L 540 600" fill="none"/>
    <circle cx="260" cy="200" r="4" fill="#57D1E8"/>
    <circle cx="540" cy="200" r="4" fill="#57D1E8"/>
    <circle cx="260" cy="600" r="4" fill="#FF9900"/>
    <circle cx="540" cy="600" r="4" fill="#FF9900"/>
  </g>

  <!-- ========================================== -->
  <!-- TOP NEURAL NETWORK / BRAIN DENDRITES (CYAN) -->
  <!-- ========================================== -->
  <g filter="url(#glowCyan)" stroke="url(#cyanNeon)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Trunk -->
    <line x1="400" y1="340" x2="400" y2="240" stroke-width="5" />
    <line x1="400" y1="240" x2="400" y2="160" stroke-width="4" />
    <line x1="400" y1="160" x2="400" y2="110" stroke-width="3" />

    <!-- Primary Left Branches -->
    <path d="M 400 310 L 330 260 L 270 260 L 230 210" stroke-width="4"/>
    <path d="M 330 260 L 330 190 L 290 150" stroke-width="3.5"/>
    <path d="M 400 240 L 350 170 L 310 120" stroke-width="3.5"/>
    <path d="M 350 170 L 380 130" stroke-width="2.5"/>
    <path d="M 270 260 L 240 310 L 190 310" stroke-width="3"/>
    <path d="M 230 210 L 180 200 L 150 160" stroke-width="2.5"/>

    <!-- Primary Right Branches (Symmetrical) -->
    <path d="M 400 310 L 470 260 L 530 260 L 570 210" stroke-width="4"/>
    <path d="M 470 260 L 470 190 L 510 150" stroke-width="3.5"/>
    <path d="M 400 240 L 450 170 L 490 120" stroke-width="3.5"/>
    <path d="M 450 170 L 420 130" stroke-width="2.5"/>
    <path d="M 530 260 L 560 310 L 610 310" stroke-width="3"/>
    <path d="M 570 210 L 620 200 L 650 160" stroke-width="2.5"/>

    <!-- Cross Synaptic Interconnects -->
    <line x1="330" y1="190" x2="350" y2="170" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="470" y1="190" x2="450" y2="170" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="270" y1="260" x2="330" y2="190" stroke-width="2"/>
    <line x1="530" y1="260" x2="470" y2="190" stroke-width="2"/>

    <!-- Cyan Glowing Synapse Nodes -->
    <g fill="#A6F4FF" stroke="#00D2FF" stroke-width="2">
      <circle cx="400" cy="110" r="8" />
      <circle cx="310" cy="120" r="7" />
      <circle cx="490" cy="120" r="7" />
      <circle cx="290" cy="150" r="6" />
      <circle cx="510" cy="150" r="6" />
      <circle cx="380" cy="130" r="5" />
      <circle cx="420" cy="130" r="5" />
      <circle cx="150" cy="160" r="6" />
      <circle cx="650" cy="160" r="6" />
      <circle cx="230" cy="210" r="7" />
      <circle cx="570" cy="210" r="7" />
      <circle cx="190" cy="310" r="6" />
      <circle cx="610" cy="310" r="6" />
      <circle cx="330" cy="260" r="8" />
      <circle cx="470" cy="260" r="8" />
      <circle cx="400" cy="240" r="9" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CENTER BRAND TYPOGRAPHY: NEURO-OS          -->
  <!-- ========================================== -->
  <g filter="url(#glowCyan)">
    <!-- Tech Accent Brackets -->
    <path d="M 120 380 L 100 400 L 120 420" fill="none" stroke="#57D1E8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 680 380 L 700 400 L 680 420" fill="none" stroke="#57D1E8" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="400" x2="180" y2="400" stroke="#57D1E8" stroke-width="3"/>
    <line x1="620" y1="400" x2="660" y2="400" stroke="#57D1E8" stroke-width="3"/>

    <!-- Main Text -->
    <text x="400" y="422" 
          font-family="'Montserrat', 'SF Pro Display', 'Segoe UI', sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="9" 
          fill="url(#textGrad)" 
          text-anchor="middle"
          stroke="#00D2FF"
          stroke-width="1.5">NEURO-OS</text>

    <!-- Subtitle -->
    <text x="400" y="458" 
          font-family="'SF Mono', 'Courier New', monospace" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#57D1E8" 
          text-anchor="middle"
          opacity="0.85">COGNITIVE BARE-METAL MATRIX</text>
  </g>

  <!-- ========================================== -->
  <!-- BOTTOM SILICON ROOT NETWORK (AMBER/BRONZE)  -->
  <!-- ========================================== -->
  <g filter="url(#glowAmber)" stroke="url(#amberNeon)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Inverted Trunk -->
    <line x1="400" y1="480" x2="400" y2="560" stroke-width="5" />
    <line x1="400" y1="560" x2="400" y2="640" stroke-width="4" />
    <line x1="400" y1="640" x2="400" y2="690" stroke-width="3" />

    <!-- Primary Left Root Branches -->
    <path d="M 400 500 L 330 550 L 270 550 L 230 600" stroke-width="4"/>
    <path d="M 330 550 L 330 620 L 290 660" stroke-width="3.5"/>
    <path d="M 400 560 L 350 630 L 310 680" stroke-width="3.5"/>
    <path d="M 350 630 L 380 670" stroke-width="2.5"/>
    <path d="M 270 550 L 240 500 L 190 500" stroke-width="3"/>
    <path d="M 230 600 L 180 610 L 150 650" stroke-width="2.5"/>

    <!-- Primary Right Root Branches (Symmetrical) -->
    <path d="M 400 500 L 470 550 L 530 550 L 570 600" stroke-width="4"/>
    <path d="M 470 550 L 470 620 L 510 660" stroke-width="3.5"/>
    <path d="M 400 560 L 450 630 L 490 680" stroke-width="3.5"/>
    <path d="M 450 630 L 420 670" stroke-width="2.5"/>
    <path d="M 530 550 L 560 500 L 610 500" stroke-width="3"/>
    <path d="M 570 600 L 620 610 L 650 650" stroke-width="2.5"/>

    <!-- Cross Silicon Traces -->
    <line x1="330" y1="620" x2="350" y2="630" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="470" y1="620" x2="450" y2="630" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="270" y1="550" x2="330" y2="620" stroke-width="2"/>
    <line x1="530" y1="550" x2="470" y2="620" stroke-width="2"/>

    <!-- Amber Glowing Energy Nodes -->
    <g fill="#FFD280" stroke="#FF9900" stroke-width="2">
      <circle cx="400" cy="690" r="8" />
      <circle cx="310" cy="680" r="7" />
      <circle cx="490" cy="680" r="7" />
      <circle cx="290" cy="660" r="6" />
      <circle cx="510" cy="660" r="6" />
      <circle cx="380" cy="670" r="5" />
      <circle cx="420" cy="670" r="5" />
      <circle cx="150" cy="650" r="6" />
      <circle cx="650" cy="650" r="6" />
      <circle cx="230" cy="600" r="7" />
      <circle cx="570" cy="600" r="7" />
      <circle cx="190" cy="500" r="6" />
      <circle cx="610" cy="500" r="6" />
      <circle cx="330" cy="550" r="8" />
      <circle cx="470" cy="550" r="8" />
      <circle cx="400" cy="560" r="9" />
    </g>
  </g>

  <!-- Corner Tech Accents -->
  <g stroke="#57D1E8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 60 90 L 60 60 L 90 60"/>
    <path d="M 740 90 L 740 60 L 710 60"/>
    <path d="M 60 710 L 60 740 L 90 740"/>
    <path d="M 740 710 L 740 740 L 710 740"/>
  </g>
</svg>
